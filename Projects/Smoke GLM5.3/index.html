<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Rose Day 🌹</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Soft petals that keep falling forever (generated by script.js) -->
  <div id="petal-rain" aria-hidden="true"></div>

  <!-- Main centered card -->
  <main class="card">
    <h1 class="title">Happy Rose Day <span class="rose-emoji">🌹</span></h1>

    <p class="message">
      A single rose says what words cannot —<br />
      every petal carries a whisper of my heart for you.
    </p>

    <!-- Pure CSS rose (no images, just one div of petals styled in CSS) -->
    <div class="rose" aria-hidden="true">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="core"></div>
      <div class="stem"></div>
      <div class="leaf leaf-left"></div>
      <div class="leaf leaf-right"></div>
    </div>

    <button id="send-btn" type="button">Send a Rose</button>

    <!-- A random sweet message appears here on every click -->
    <p id="sweet-message" class="sweet-message" role="status" aria-live="polite"></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
